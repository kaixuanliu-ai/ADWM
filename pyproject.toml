[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adwm"
version = "0.1.0"
description = "Latent diffusion world models for off-policy LLM-agent evaluation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ADWM authors" }]
keywords = ["off-policy-evaluation", "world-models", "diffusion", "llm-agents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch==2.6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = [
    "vllm==0.8.5",
    "transformers==5.3.0",
    "accelerate>=1.0",
    "sentencepiece>=0.1.99",
    "peft==0.19.1",
    "bitsandbytes>=0.45",
]
envs = [
    "alfworld==0.4.2",
    "scienceworld>=1.2",
    "datasets>=2.19",
]

dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["adwm*", "collect*"]
